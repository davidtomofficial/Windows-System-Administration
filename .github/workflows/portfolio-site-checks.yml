name: Portfolio site checks (no deploy)

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tools/validate-portfolio-site.mjs'
      - '.github/workflows/portfolio-site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show environment
        run: node --version
      - name: Validate markup and paths
        run: node tools/validate-portfolio-site.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check site/demos/name-planner.mjs
      - name: Exercise synthetic demo fixtures
        run: node --test site/tests/name-planner.test.mjs
